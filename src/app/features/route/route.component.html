<div class="container">
  <div class="form mt-5">
    <h1 class="font-xl">
      {{ 'ROUTE.title' | translate }}
      <i (click)="add()" class="pi pi-plus-circle font-l cursor-pointer"></i>
    </h1>

    <div class="mb-3">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input type="text" style="padding-left: 32px" pInputText placeholder="{{ 'ROUTE.search' | translate }}" [(ngModel)]="searchTerm" (input)="filterRoutes()" />
      </span>
    </div>

    <p-table
      [value]="filteredRoutes"
      [paginator]="true"
      [rows]="20"
      [rowsPerPageOptions]="[20, 50, 100, 150]"
      [globalFilterFields]="['route', 'distance']"
      [responsiveLayout]="'scroll'"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="route">
            {{ 'ROUTE.form.route' | translate }}
            <p-sortIcon field="route"></p-sortIcon>
          </th>
          <th pSortableColumn="distance">
            {{ 'ROUTE.form.distance' | translate }}
            <p-sortIcon field="distance"></p-sortIcon>
          </th>
          <th>{{ 'ACTIONS' | translate }}</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-route>
        <tr>
          <td>{{ route.route }}</td>
          <td>{{ route.distance }} km</td>
          <td class="b-icon">
            <i class="pi pi-trash pl-3 cursor-pointer" (click)="delete(route.id)"></i>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
